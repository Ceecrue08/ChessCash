name: Build ChessCash APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/android
          npx cap add android
          mkdir -p android/app/src/main/assets/public
          cp index.html manifest.json icon-*.png android/app/src/main/assets/public/ 2>/dev/null || cp index.html android/app/src/main/assets/public/
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessCash-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
