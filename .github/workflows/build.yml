name: Build ChessCash APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Simple WebView APK
        run: |
          # buat struktur
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/chesscash/app
          
          # copy game kamu
          cp index.html app/src/main/assets/index.html
          
          # Manifest
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.chesscash.app">
            <application android:label="ChessCash" android:allowBackup="false" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST
          
          # MainActivity
          cat > app/src/main/java/com/chesscash/app/MainActivity.java << 'JAVA'
          package com.chesscash.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b){
              super.onCreate(b);
              WebView w = new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              w.loadUrl("file:///android_asset/index.html");
              setContentView(w);
            }
          }
          JAVA
          
          # Gradle files
          cat > settings.gradle << 'GRADLE'
          include ':app'
          GRADLE
          
          cat > build.gradle << 'GRADLE'
          buildscript{
            repositories{google(); mavenCentral()}
            dependencies{classpath 'com.android.tools.build:gradle:8.1.4'}
          }
          GRADLE
          
          cat > app/build.gradle << 'GRADLE'
          apply plugin: 'com.android.application'
          android{
            compileSdk 34
            namespace 'com.chesscash.app'
            defaultConfig{
              applicationId "com.chesscash.app"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            compileOptions{sourceCompatibility 1_8; targetCompatibility 1_8}
          }
          dependencies{}
          GRADLE
          
          # Download gradle wrapper manually
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d /tmp
          /tmp/gradle-8.4/bin/gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ChessCash-APK
          path: app/build/outputs/apk/debug/app-debug.apk
